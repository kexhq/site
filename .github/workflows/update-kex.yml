# Resolve the latest @kexhq/kex release and open a PR bumping it.
# Run manually from the Actions tab: "Update kex" → Run workflow.
name: Update kex

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: read

jobs:
  update-kex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve latest version
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # @kexhq/kex ships as 0.0.0-dev.<sha> builds with no `latest` dist-tag,
          # so `npm view ... version` resolves to "". The packages API lists
          # versions newest-first, so [0] is the most recently published.
          latest=$(gh api /orgs/kexhq/packages/npm/kex/versions --jq '.[0].name')
          [ -n "$latest" ] || { echo "error: could not resolve latest @kexhq/kex version"; exit 1; }
          # Strip any leading ^/~ so an exact version is compared against `latest`.
          current=$(node -p "require('./package.json').dependencies['@kexhq/kex'].replace(/^[~^]/,'')")
          {
            echo "latest=$latest"
            echo "current=$current"
          } >> "$GITHUB_OUTPUT"
          echo "Latest published: $latest (current: $current)"

      - name: Bump @kexhq/kex
        if: steps.latest.outputs.latest != steps.latest.outputs.current
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install @kexhq/kex@${{ steps.latest.outputs.latest }} --save-exact

      - name: Open pull request
        if: steps.latest.outputs.latest != steps.latest.outputs.current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.latest.outputs.latest }}"
          current="${{ steps.latest.outputs.current }}"
          branch="update-kex"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git commit -am "chore: bump @kexhq/kex to $version" \
            || { echo "Already up to date — nothing to commit"; exit 0; }
          git push origin "$branch" --force

          printf '%s\n' \
            "Bumps \`@kexhq/kex\` from \`${current}\` to \`${version}\`." \
            "" \
            "Generated by the **Update kex** workflow (Actions → \"Update kex\" → Run workflow)." \
            > pr-body.md

          # Only match OPEN PRs. A previously MERGED PR on this branch must not
          # absorb new bumps — otherwise we'd edit a closed PR and never open a
          # new one. (This is what silently broke updates after PR #3 merged.)
          open_pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$open_pr" ]; then
            gh pr edit "$open_pr" \
              --title "chore: bump @kexhq/kex to $version" \
              --body-file pr-body.md
          else
            gh pr create \
              --title "chore: bump @kexhq/kex to $version" \
              --body-file pr-body.md \
              --base main \
              --head "$branch"
          fi

      - name: Already up to date
        if: steps.latest.outputs.latest == steps.latest.outputs.current
        run: echo "kex is already at the latest version (${{ steps.latest.outputs.latest }})"
